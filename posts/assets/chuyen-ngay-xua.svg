<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"
     aria-labelledby="t d">
  <title id="t">Đêm phố cũ — minh hoạ gốc</title>
  <desc id="d">Tranh vector gốc: một ngọn đèn đường lẻ loi trong đêm, vòng sáng toả thành những
    cung sóng âm, một nhành cây trơ lá và vầng trăng khuyết.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1422"/>
      <stop offset="52%"  stop-color="#14213d"/>
      <stop offset="100%" stop-color="#1e3350"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffd9a0" stop-opacity=".40"/>
      <stop offset="55%"  stop-color="#ffcf8a" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#ffc77a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bulb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff3d6" stop-opacity=".95"/>
      <stop offset="45%"  stop-color="#ffd79a" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ffc77a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a9d8f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a9d8f" stop-opacity=".16"/>
    </linearGradient>
    <mask id="moon">
      <rect width="800" height="450" fill="#000"/>
      <circle cx="652" cy="86" r="34" fill="#fff"/>
      <circle cx="637" cy="76" r="31" fill="#000"/>
    </mask>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- sao -->
  <g fill="#e8f0fb">
    <circle cx="96"  cy="58"  r="1.6" opacity=".75"/>
    <circle cx="168" cy="110" r="1.1" opacity=".5"/>
    <circle cx="243" cy="46"  r="1.4" opacity=".65"/>
    <circle cx="330" cy="96"  r="1"   opacity=".42"/>
    <circle cx="418" cy="54"  r="1.5" opacity=".6"/>
    <circle cx="506" cy="118" r="1.1" opacity=".45"/>
    <circle cx="560" cy="42"  r="1.3" opacity=".55"/>
    <circle cx="726" cy="150" r="1.2" opacity=".5"/>
    <circle cx="60"  cy="168" r="1"   opacity=".38"/>
    <circle cx="764" cy="64"  r="1"   opacity=".4"/>
  </g>

  <!-- trăng khuyết -->
  <rect width="800" height="450" fill="#f4e3bd" mask="url(#moon)" opacity=".9"/>
  <circle cx="652" cy="86" r="52" fill="#f4e3bd" opacity=".05"/>

  <!-- nhành cây trơ lá -->
  <g stroke="#060d18" stroke-linecap="round" fill="none">
    <path d="M0 150 C 54 146, 92 160, 128 182" stroke-width="7"/>
    <path d="M128 182 C 150 196, 160 214, 164 236" stroke-width="4.5"/>
    <path d="M74 152 C 86 132, 92 118, 90 100"  stroke-width="3.5"/>
    <path d="M104 166 C 120 154, 136 150, 152 152" stroke-width="3"/>
    <path d="M90 100 C 84 90, 74 84, 62 82" stroke-width="2.2"/>
    <path d="M152 152 C 162 146, 172 146, 180 150" stroke-width="2"/>
    <path d="M40 148 C 34 134, 26 126, 14 120" stroke-width="2.4"/>
  </g>

  <!-- vòng sáng + cột đèn -->
  <polygon points="372,150 300,418 500,418 428,150" fill="url(#cone)"/>
  <circle cx="400" cy="150" r="78" fill="url(#bulb)"/>

  <!-- cung sóng âm trong vòng sáng -->
  <g fill="none" stroke="#ffe6bd" stroke-linecap="round">
    <path d="M330 262 A 92 92 0 0 1 470 262" stroke-width="2.1" opacity=".42"/>
    <path d="M310 312 A 128 128 0 0 1 490 312" stroke-width="1.9" opacity=".3"/>
    <path d="M292 360 A 164 164 0 0 1 508 360" stroke-width="1.7" opacity=".2"/>
    <path d="M352 214 A 58 58 0 0 1 448 214" stroke-width="2.2" opacity=".5"/>
  </g>

  <g fill="#060d18">
    <rect x="394" y="150" width="12" height="268" rx="4"/>
    <path d="M378 150 L422 150 L412 126 L388 126 Z"/>
    <rect x="386" y="118" width="28" height="9" rx="4"/>
    <rect x="368" y="412" width="64" height="10" rx="5"/>
  </g>
  <circle cx="400" cy="140" r="7" fill="#ffeccb" opacity=".95"/>

  <!-- mặt đất và sương -->
  <rect y="408" width="800" height="42" fill="#060d18"/>
  <rect y="330" width="800" height="120" fill="url(#mist)"/>
  <ellipse cx="400" cy="420" rx="118" ry="11" fill="#ffd9a0" opacity=".10"/>
</svg>
