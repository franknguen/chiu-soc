<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Chiều quê — minh hoạ gốc</title>
  <desc id="d">Tranh vector gốc: buổi chiều trên cánh đồng, một khóm tre bên trái, dòng sông uốn
    khúc với con thuyền nhỏ, mái nhà và cây cổ thụ phía xa, đàn chim về tổ.</desc>

  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2d1f45"/>
      <stop offset="34%"  stop-color="#7d4063"/>
      <stop offset="64%"  stop-color="#d9834c"/>
      <stop offset="100%" stop-color="#f4c884"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff0c4" stop-opacity=".95"/>
      <stop offset="40%"  stop-color="#ffcf86" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ffb867" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="field1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7a46"/><stop offset="100%" stop-color="#4e5c33"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#46542f"/><stop offset="100%" stop-color="#2d3a20"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f7d49a"/>
      <stop offset="55%"  stop-color="#e9a564"/>
      <stop offset="100%" stop-color="#b9743f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#dusk)"/>

  <!-- mặt trời sắp lặn -->
  <circle cx="556" cy="262" r="104" fill="url(#sunglow)"/>
  <circle cx="556" cy="262" r="38"  fill="#ffe3a8" opacity=".92"/>

  <!-- đàn chim về tổ -->
  <g stroke="#2a1c33" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".75">
    <path d="M196 92  q 9 -8 18 0  q 9 -8 18 0"/>
    <path d="M250 70  q 7 -7 14 0  q 7 -7 14 0"/>
    <path d="M300 104 q 8 -7 16 0  q 8 -7 16 0"/>
    <path d="M356 80  q 6 -6 12 0  q 6 -6 12 0"/>
  </g>

  <!-- rặng cây phía xa -->
  <path d="M0 272 q 40 -16 78 -4 q 36 -22 76 -6 q 44 -20 88 -2 q 40 -18 84 -4
           q 46 -16 90 -2 q 44 -14 92 -4 q 48 -12 94 2 q 50 -10 98 4 L800 290 L0 290 Z"
        fill="#2f2436" opacity=".85"/>

  <!-- ruộng -->
  <path d="M0 290 Q 200 278 420 292 Q 620 304 800 292 L800 348 L0 348 Z" fill="url(#field1)"/>
  <path d="M0 344 Q 220 332 440 348 Q 640 360 800 346 L800 450 L0 450 Z" fill="url(#field2)"/>
  <g stroke="#7f8f58" stroke-width="1.5" opacity=".28">
    <path d="M40 316 H 760" /><path d="M20 332 H 780"/>
    <path d="M0 372 H 800" stroke="#5d6b3c"/><path d="M0 398 H 800" stroke="#5d6b3c"/>
  </g>

  <!-- dòng sông -->
  <path d="M352 290 C 330 330, 286 362, 212 392 C 150 416, 96 430, 44 450 L250 450
           C 300 420, 356 384, 392 340 C 408 320, 414 302, 414 290 Z" fill="url(#water)"/>
  <g stroke="#fff1cf" stroke-linecap="round" opacity=".55">
    <path d="M330 320 q 20 5 38 0" stroke-width="2"/>
    <path d="M276 356 q 24 6 46 0" stroke-width="2"/>
    <path d="M200 398 q 28 7 54 0" stroke-width="2.2"/>
  </g>

  <!-- con thuyền -->
  <g fill="#2a1c33">
    <path d="M250 366 q 26 14 54 0 q -14 16 -27 16 q -13 0 -27 -16 Z"/>
    <rect x="274" y="338" width="2.6" height="28" rx="1.2"/>
    <path d="M277 340 q 18 8 0 20 Z" opacity=".9"/>
  </g>

  <!-- mái nhà và cây cổ thụ bên phải -->
  <g fill="#241a2c">
    <path d="M636 292 L690 262 L744 292 Z"/>
    <rect x="652" y="290" width="76" height="26"/>
    <rect x="678" y="300" width="18" height="16" fill="#f4c884" opacity=".7"/>
    <rect x="762" y="236" width="9" height="82" rx="4"/>
    <ellipse cx="766" cy="226" rx="38" ry="28"/>
    <ellipse cx="740" cy="240" rx="24" ry="18"/>
  </g>

  <!-- khóm tre bên trái -->
  <g stroke="#1f1828" fill="none" stroke-linecap="round">
    <path d="M86 450 C 72 340, 78 250, 104 168" stroke-width="7"/>
    <path d="M124 450 C 118 348, 128 268, 152 196" stroke-width="5.5"/>
    <path d="M52 450 C 44 358, 44 288, 60 224" stroke-width="5"/>
    <path d="M160 450 C 158 372, 166 314, 182 262" stroke-width="4"/>
  </g>
  <g fill="#1f1828" opacity=".92">
    <path d="M104 168 q 34 -16 58 -6 q -30 16 -58 6 Z"/>
    <path d="M104 168 q -36 -20 -60 -12 q 28 20 60 12 Z"/>
    <path d="M152 196 q 32 -20 56 -14 q -28 22 -56 14 Z"/>
    <path d="M60 224 q -30 -18 -52 -12 q 24 20 52 12 Z"/>
    <path d="M182 262 q 30 -14 50 -8 q -26 18 -50 8 Z"/>
    <path d="M124 214 q 28 -14 46 -8 q -24 16 -46 8 Z"/>
  </g>

  <!-- cỏ tiền cảnh -->
  <g stroke="#1b1524" stroke-width="2.2" stroke-linecap="round" opacity=".8">
    <path d="M420 450 q 6 -26 2 -40"/><path d="M436 450 q 10 -22 20 -32"/>
    <path d="M466 450 q 2 -28 -4 -40"/><path d="M620 450 q 8 -24 4 -36"/>
    <path d="M640 450 q 12 -20 22 -28"/>
  </g>
</svg>
